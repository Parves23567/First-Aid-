  .search-results{margin-top:10px;}

  @media(max-width:900px){

</style>

<script>
/* ================= CONTENT DATA ================= */
const topics = [
/* ---------------- PART A: FIRST AID (Day 1-3) ---------------- */
{
  id:"icrc-info", part:"info", day:"Fact Sheet · Jan–Dec 2025", num:"ℹ",
  title:"ICRC বাংলাদেশে — জানুয়ারি-ডিসেম্বর ২০২৫",
  subtitle:"রেড ক্রস আন্তর্জাতিক কমিটি (ICRC)-এর বাংলাদেশে ২০২৫ সালের কার্যক্রমের সংক্ষিপ্ত চিত্র",
  html:`
  <div class="section-block">
    <h3><span class="dot"></span>ICRC কী</h3>
    <p>International Committee of the Red Cross (ICRC) একটি নিরপেক্ষ, স্বাধীন ও মানবিক আন্তর্জাতিক সংস্থা, যার মূল কাজ সশস্ত্র সংঘাত ও অন্যান্য সহিংসতায় ক্ষতিগ্রস্ত মানুষের জীবন ও মর্যাদা রক্ষা করা এবং তাদের সহায়তা দেওয়া। বাংলাদেশে ICRC আটক ব্যক্তিদের অবস্থা পর্যবেক্ষণ করে, বাংলাদেশ রেড ক্রিসেন্ট সোসাইটি (BDRCS)-এর সাথে মিলে কাজ করে, এবং আন্তর্জাতিক মানবিক আইন (IHL) সম্পর্কে সচেতনতা বাড়ায়।</p>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>পুলিশ ও ফার্স্ট এইড প্রশিক্ষণ — ২০২৫-এর হাইলাইটস</h3>
    <p>এই কোর্সের সাথে সরাসরি সম্পর্কিত কিছু তথ্য:</p>
    <ul>
      <li>ঢাকা, চট্টগ্রাম, রাজশাহী মেট্রোপলিটন পুলিশ, কক্সবাজার ও খুলনা জেলা পুলিশ থেকে <strong>১৪০ জন পুলিশ সদস্য</strong> ও CRP-এর সদস্যরা বেসিক ফার্স্ট এইড প্রশিক্ষণ পেয়েছেন</li>
      <li><strong>৪৯৫ জন পুলিশ কর্মকর্তা</strong> বলপ্রয়োগের নিয়ম, আচরণবিধি ও আন্তর্জাতিক পুলিশিং মানদণ্ড নিয়ে প্রশিক্ষণ পেয়েছেন</li>
      <li>প্রায় <strong>১,৪০০ জন সিনিয়র সামরিক ও পুলিশ কর্মকর্তা</strong> আন্তর্জাতিক মানবিক আইন (IHL)-এ প্রশিক্ষিত হয়েছেন, যার মধ্যে ১,০১০ জন জাতিসংঘ মিশনে (MINUSCA, MONUSCO) যাওয়ার আগে প্রি-ডিপ্লয়মেন্ট প্রশিক্ষণ পেয়েছেন</li>
      <li>জরুরি সাড়াদানের সক্ষমতা বাড়াতে ১১টি BDRCS ইউনিট ও ঢাকা-চট্টগ্রাম-রাজশাহী মেট্রোপলিটন পুলিশ, খুলনা-কক্সবাজার জেলা পুলিশ এবং CRP-কে <strong>১০,১৪০টি PPE সরঞ্জাম, ১,৯৩৩টি ফার্স্ট এইড সরঞ্জাম, ৬৪টি ফার্স্ট এইড রেসপন্ডার ব্যাগ ও ২টি CPR ম্যানিকিন</strong> সরবরাহ করা হয়েছে</li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>আটক কেন্দ্র ও মানবিক কার্যক্রম</h3>
    <ul>
      <li>৩টি স্থানে ১১,০০০-এর বেশি আটক ব্যক্তির জন্য <strong>৯টি ডিটেনশন ভিজিট</strong> পরিচালিত হয়েছে</li>
      <li><strong>৩৯০ জন ঝুঁকিপূর্ণ আটক ব্যক্তি</strong> (বিদেশি ও পরিবারের সাথে যোগাযোগহীন) হাইজিন কিট পেয়েছেন</li>
      <li>কক্সবাজার জেলা কারাগারের <strong>২,৯২৫ জন</strong> আটক ব্যক্তি ও কর্মী নিরাপদ পানীয় জল ব্যবস্থা ও বিনোদন সুবিধা থেকে উপকৃত হয়েছেন</li>
      <li><strong>৬৯৫ জন নিখোঁজ ব্যক্তি</strong>র পরিণতি ও অবস্থান নিশ্চিত করা হয়েছে; পরিবারের সাথে যোগাযোগের জন্য ৬১২টি রেড ক্রস মেসেজ ও ৩০টি সালামত (মৌখিক বার্তা) আদান-প্রদান হয়েছে</li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>BDRCS প্রশিক্ষণ ও অন্যান্য কার্যক্রম</h3>
    <ul>
      <li><strong>২৭০ জন BDRCS যুব স্বেচ্ছাসেবক ও কর্মী</strong> অ্যাডভান্সড ফার্স্ট এইড প্রশিক্ষণ পেয়েছেন, এর মধ্যে ২৪ জন ট্রেনিং অব ট্রেইনার্স (ToT) এবং ২৯ জন রিফ্রেশার প্রশিক্ষণ সম্পন্ন করেছেন</li>
      <li>দেশজুড়ে সহিংসতা ও জরুরি পরিস্থিতিতে <strong>৬৩টি BDRCS ফার্স্ট এইড টিম</strong> মোতায়েন হয়েছে — যার মধ্যে মাইলস্টোন প্লেন দুর্ঘটনা ও কড়াইল বস্তির আগুন উল্লেখযোগ্য — মোট <strong>১,০৩১ জনকে</strong> প্রাথমিক চিকিৎসা দেওয়া হয়েছে এবং <strong>২২৬ জনকে</strong> হাসপাতালে রেফার করা হয়েছে</li>
      <li><strong>১২৪ জন প্রতিবন্ধী ব্যক্তি</strong> সামাজিক অন্তর্ভুক্তিমূলক ক্রীড়া কার্যক্রমে অংশ নিয়েছেন এবং ১০৫ জন পুনর্বাসন পেশাজীবী প্রশিক্ষিত হয়েছেন</li>
    </ul>
  </div>

  html:`
  <div class="section-block">
    <h3><span class="dot"></span>Day 1 — পরিচিতি, শ্বাসরোধ ও CPR</h3>
    <p>প্রথম দিনে অংশগ্রহণকারীদের উপস্থিতি, প্রশিক্ষণের উদ্দেশ্য ও প্রি-ইভ্যালুয়েশনের পর মূল বিষয়বস্তু শুরু হয়:</p>
    <ul>
      <li><strong>Session 1 — ফার্স্ট এইডের পরিচিতি:</strong> ফার্স্ট এইড কী, DRABC নীতি, AVPU স্কেল, PPE ও Primary/Secondary Assessment</li>
      <li><strong>Session 2 — শ্বাসরোধ (Choking):</strong> আংশিক ও সম্পূর্ণ বাধা চেনা, পিঠে চাপড় ও Heimlich Maneuver</li>
      <li><strong>Session 3 — CPR:</strong> বয়সভিত্তিক (Adult/Children/Infant) কম্প্রেশন কৌশল, ৩০:২ অনুপাত</li>
      <li><strong>Session 4 — শক (Shock) ও প্রতিরোধ</strong></li>
      <li><strong>Session 5 — রক্তক্ষরণ (Bleeding) ও তার ব্যবস্থাপনা</strong></li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>Day 2 — ক্ষত থেকে বিষক্রিয়া পর্যন্ত</h3>
    <p>দ্বিতীয় দিনের শুরুতে আগের দিনের রিভিউ, এরপর শারীরিক আঘাত-সংক্রান্ত বিষয়গুলো ধারাবাহিকভাবে শেখানো হয়:</p>
    <ul>
      <li><strong>Session 6 — ক্ষত ও ব্যান্ডেজ করা (Wounds & Dressing)</strong></li>

      <li><strong>Session 8 — খিঁচুনি, অজ্ঞান হয়ে পড়া ও অচেতনতা (Fit, Fainting & Unconsciousness)</strong></li>
      <li><strong>Session 9 — হাড় ভাঙা ও স্প্লিন্টিং (Bone Fracture and Immobilization)</strong></li>
      <li><strong>Session 10 — বিষক্রিয়া (Poisoning)</strong></li>

  </div>

  <div class="section-block">
    <h3><span class="dot"></span>Day 3 — কামড়, পরিবহন ও মূল্যায়ন</h3>
    <p>তৃতীয় দিনে ফার্স্ট এইড অংশ শেষ হয় এবং ট্রেনিং অব ট্রেইনার্স (ToT) অংশের প্রাথমিক পরিচিতি দিয়ে দিনটি শেষ হয়:</p>

      <li><strong>Session 11 — প্রাণীর কামড় (Bites)</strong></li>

      <li><strong>কোর্স রিভিউ ও লিখিত মূল্যায়ন (Course Review & Evaluation)</strong></li>

    </ul>
  </div>

{
  id:"aid-1", part:"aid", day:"Day 1 · Session 1", num:1,
  title:"ফার্স্ট এইডের পরিচিতি",
  subtitle:"ফার্স্ট এইড কী, কেন জরুরি, এবং একজন রেসপন্ডারের প্রাথমিক দায়িত্ব",
  html:`
  <div class="section-block">
    <h3><span class="dot"></span>ফার্স্ট এইড কী</h3>
    <p>ফার্স্ট এইড হলো কোনো আকস্মিক অসুস্থতা বা দুর্ঘটনায় আক্রান্ত ব্যক্তিকে চিকিৎসকের হাতে পৌঁছানোর আগ পর্যন্ত দেওয়া তাৎক্ষণিক ও প্রাথমিক সাহায্য। এর লক্ষ্য তিনটি —</p>
    <ul>
      <li><strong>জীবন রক্ষা করা</strong> — শ্বাসনালী খোলা রাখা, রক্তক্ষরণ বন্ধ করা</li>
      <li><strong>অবস্থার অবনতি রোধ করা</strong> — আঘাত আরও গুরুতর না হতে দেওয়া</li>
      <li><strong>সুস্থতার উন্নতিতে সহায়তা করা</strong> — আরাম ও মানসিক সহায়তা দেওয়া</li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>ফার্স্ট এইডের দুটি মূলনীতি</h3>
    <ul>
      <li><strong>নিজেকে ডাক্তার মনে করা যাবে না</strong> — নিজের সাধ্যের বাইরে গিয়ে চিকিৎসা দেওয়ার চেষ্টা করবেন না, শুধু প্রাথমিক ও জীবনরক্ষাকারী সহায়তাটুকু দিন</li>
      <li><strong>মাথা ঠান্ডা রেখে কাজ করতে হবে</strong> — যত জরুরি পরিস্থিতিই হোক, শান্ত থেকে ধাপে ধাপে কাজ করলে ভুল কম হয়</li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>একজন ফার্স্ট এইডারের ভূমিকা — DRABC নীতি</h3>
    <p>AVPU দিয়ে বোঝা গেলে আক্রান্ত ব্যক্তি অজ্ঞান (Unresponsive), তখন এই ধারাবাহিকতা মেনে DRABC প্রয়োগ করুন:</p>
    <ol>
      <li><strong>D — Danger (বিপদ যাচাই):</strong> নিজের, আক্রান্তের ও আশপাশের মানুষের নিরাপত্তা আগে নিশ্চিত করুন — জায়গাটি ঝুঁকিপূর্ণ কিনা দেখুন।</li>
      <li><strong>R — Response (সাড়া পরীক্ষা):</strong> কাঁধে হালকা ঝাঁকুনি দিয়ে জোরে ডাকুন — "আপনি ঠিক আছেন?"</li>
      <li><strong>A — Airway (শ্বাসনালী):</strong> মুখ খুলে দেখুন ও পরিষ্কার করুন, প্রয়োজনে মাথা পেছনে হেলিয়ে চোয়াল তুলে শ্বাসনালীতে বাতাস চলাচলের পথ খুলে দিন।</li>
      <li><strong>B — Breathing (শ্বাস-প্রশ্বাস):</strong> নিচের "Look-Listen-Feel" পদ্ধতিতে ১০ সেকেন্ডের মধ্যে শ্বাস পরীক্ষা করুন।</li>
      <li><strong>C — Circulation/CPR:</strong> শ্বাস না থাকলে সাথে সাথে CPR শুরু করুন এবং জরুরি সেবায় (৯৯৯) কল করুন।</li>
    </ol>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>শ্বাস পরীক্ষার পদ্ধতি — Look, Listen, Feel (১০ সেকেন্ডে)</h3>
    <p>Breathing (B) ধাপে ১০ সেকেন্ডের মধ্যে তিনভাবে শ্বাস আছে কিনা যাচাই করুন:</p>
    <ul>
      <li><strong>Look (দেখা):</strong> চোখ দিয়ে দেখুন বুক ওঠানামা করছে কিনা</li>
      <li><strong>Listen (শোনা):</strong> কান দিয়ে শুনুন শ্বাসের কোনো শব্দ হচ্ছে কিনা</li>
      <li><strong>Feel (অনুভব করা):</strong> নিজের গাল (গাল হলো শরীরের একটি সংবেদনশীল অংশ) আক্রান্তের মুখ-নাকের কাছে নিয়ে অনুভব করুন গরম বাতাস বের হচ্ছে কিনা</li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>সময়ের গুরুত্ব — গোল্ডেন টাইম</h3>
    <p>শ্বাস-প্রশ্বাস বন্ধ হয়ে গেলে সময় সবচেয়ে বড় শত্রু। মৃত্যুর প্রধান দুটি কারণ হলো <strong>অতিরিক্ত রক্তক্ষরণ</strong> ও <strong>শ্বাস-প্রশ্বাস বন্ধ হয়ে যাওয়া</strong>।</p>
    <ul>
      <li>প্রথম <strong>৩ মিনিট</strong> হলো "গোল্ডেন টাইম" — এই সময়ের মধ্যে সাড়া দিতে পারলে সবচেয়ে ভালো ফল পাওয়া যায়</li>
      <li>৩ মিনিট পার হয়ে <strong>৪-৬ মিনিটের মধ্যে</strong> মস্তিষ্কের ক্ষতি (ব্রেইন ড্যামেজ) বাড়তে থাকে</li>
      <li><strong>১০ মিনিট</strong> পার হয়ে গেলে মৃত্যুর ঝুঁকি অনেক বেড়ে যায়</li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>সচেতনতার মাত্রা যাচাই — AVPU স্কেল</h3>
    <p>আক্রান্তের সচেতনতার (consciousness) মাত্রা দ্রুত বোঝার জন্য AVPU স্কেল ব্যবহার করুন:</p>
    <ul>
      <li><strong>A — Alertness (সজাগ):</strong> আক্রান্ত পুরোপুরি সজাগ ও সাড়া দিচ্ছে</li>
      <li><strong>V — Response to Voice (ডাকে সাড়া):</strong> ডাকলে সাড়া দেয়</li>
      <li><strong>P — Response to Pain (ব্যথায় সাড়া):</strong> ডাকে সাড়া না দিলে হালকা ব্যথা দিয়ে (যেমন চিমটি) পরীক্ষা করুন</li>
      <li><strong>U — Unresponsive (কোনো সাড়া নেই):</strong> ডাকে বা ব্যথায় কোনো সাড়া নেই — এটি সবচেয়ে গুরুতর অবস্থা, এখানেই DRABC শুরু হয়</li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>নিজের সুরক্ষা — PPE ব্যবহার</h3>
    <p>আক্রান্তকে সাহায্য করার আগে যতটা সম্ভব নিজের সুরক্ষা সরঞ্জাম (Personal Protection Equipment) ব্যবহার করুন — যেমন গ্লাভস বা ওয়াটারপ্রুফ প্রোটেকশন — যাতে রক্ত বা শরীরের তরলের সংস্পর্শ থেকে সংক্রমণ এড়ানো যায়। হাতের কাছে প্রস্তুত PPE না থাকলে আশপাশে যা পাওয়া যায় (যেমন পরিষ্কার কাপড়, প্লাস্টিক) — এই স্থানীয় সম্পদ (local resource) ব্যবহার করুন।</p>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>Primary ও Secondary Assessment</h3>

      <li>আক্রান্তকে অকারণে নড়াচড়া করানো</li>
      <li>ভিড় জমতে দেওয়া</li>

  </div>

  <div class="example-card">

    রাস্তায় একজন মোটরসাইকেল আরোহী পড়ে গেছেন। প্রথমে ট্রাফিক থামিয়ে দৃশ্যপট নিরাপদ করুন (Danger), তারপর তাঁর কাঁধে হাত রেখে ডাকুন (Response), সাড়া না দিলে শ্বাসনালী পরীক্ষা করুন (Airway) — এভাবেই DRABC প্রয়োগ হয়।

{
  id:"aid-3", part:"aid", day:"Day 1 · Session 3", num:3,
  title:"কার্ডিওপালমোনারি রিসাসিটেশন (CPR)",
  subtitle:"হৃদস্পন্দন ও শ্বাস বন্ধ হয়ে গেলে জীবন বাঁচানোর কৌশল",
  html:`
  <div class="section-block">
    <h3><span class="dot"></span>CPR কখন প্রয়োজন</h3>
    <p>যখন কোনো ব্যক্তির হৃদস্পন্দন ও স্বাভাবিক শ্বাস-প্রশ্বাস বন্ধ হয়ে যায় (কার্ডিয়াক অ্যারেস্ট), তখন মস্তিষ্কে অক্সিজেন সরবরাহ ধরে রাখতে অবিলম্বে CPR শুরু করতে হয়। প্রতি মিনিট দেরিতে বেঁচে থাকার সম্ভাবনা ১০% করে কমে যায়।</p>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>ধাপে ধাপে CPR (প্রাপ্তবয়স্ক)</h3>
    <ol>
      <li>নিরাপত্তা যাচাই করে সাড়া পরীক্ষা করুন; সাড়া না পেলে সাহায্যের জন্য চিৎকার করুন ও জরুরি সেবায় (৯৯৯) কল করান — সম্ভব হলে আশপাশের মানুষকে সাক্ষী রাখুন ও তাদের অনুমতি/সহযোগিতা নিন</li>
      <li>আক্রান্তকে শক্ত সমতল জায়গায় চিৎ করে শোয়ান, বুক ভালোভাবে দেখার জন্য বুকের কাছের জামা যতটা সম্ভব খুলে দিন</li>
      <li>হাতের চাপ ঠিক কোথায় দেবেন তা আগে ঠিক করে নিন — বুকের মাঝ বরাবর, স্তনহাড়ের (sternum) উপর, একদম নিচের ছোট গর্তের মতো নরম অংশ (xiphoid process) এড়িয়ে তার একটু উপরে এক হাতের গোড়ালি রাখুন, অন্য হাত তার উপর রাখুন, আঙুল একসাথে গেঁথে দিন</li>
      <li>কনুই সোজা রেখে কাঁধ থেকে শক্তি দিয়ে <strong>৫-৬ সেমি (২-২.৫ ইঞ্চি) গভীর</strong> করে বুক চাপুন</li>
      <li>প্রতি মিনিটে <strong>১০০-১২০ বার</strong> গতিতে ৩০টি কম্প্রেশন দিন (গানের তাল: "Stayin' Alive")</li>
      <li>মাথা পেছনে হেলিয়ে চোয়াল তুলে শ্বাসনালী খুলে ২টি রেসকিউ ব্রিদ দিন (প্রশিক্ষণ থাকলে)</li>
      <li>৩০ কম্প্রেশন + ২ ব্রিদ — এই চক্র পুনরাবৃত্তি করুন যতক্ষণ না জরুরি সেবা পৌঁছায় বা আক্রান্তের অবস্থার পরিবর্তন (change) আসে</li>
      <li>AED (অটোমেটেড এক্সটার্নাল ডিফিব্রিলেটর) পাওয়া গেলে দ্রুত ব্যবহার করুন — যন্ত্রের নির্দেশনা অনুসরণ করুন</li>
    </ol>
  </div>

  <div class="do-dont">
    <div class="do-box"><h4>✓ করণীয়</h4><ul>
      <li>প্রতিটি কম্প্রেশনের পর বুক পুরোপুরি উঠতে দিন</li>
      <li>কম্প্রেশনে বিরতি যতটা সম্ভব কম রাখুন</li>
      <li>ক্লান্ত হলে অন্য কেউ থাকলে পালাবদল করুন</li>
      <li>শুরুর আগে আশপাশের মানুষকে সাক্ষী রাখুন বা অনুমতি নিন যেখানে সম্ভব</li>
    </ul></div>
    <div class="dont-box"><h4>✗ বর্জনীয়</h4><ul>
      <li>শ্বাস পরীক্ষা না করেই CPR শুরু করবেন না</li>
      <li>খুব হালকা বা খুব দ্রুত-অনিয়মিত চাপ দেবেন না</li>
      <li>শিশুর ক্ষেত্রে প্রাপ্তবয়স্কের মতো একই বলে চাপ দেবেন না — এক হাত/দুই আঙুল ব্যবহার করুন</li>
    </ul></div>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>বয়স অনুযায়ী CPR-এর ভিন্নতা</h3>
    <p>বয়সভেদে আক্রান্তকে তিন ভাগে ভাগ করা হয় — এবং প্রতিটির জন্য হাতের কৌশল ও চাপের গভীরতা আলাদা, যদিও অনুপাত সবসময় <strong>৩০ কম্প্রেশন : ২ শ্বাস</strong> এবং গতি মিনিটে ১০০-১২০ বার:</p>
    <ul>
      <li><strong>প্রাপ্তবয়স্ক (Adult, ১২ বছরের বেশি):</strong> দুই হাত একসাথে, স্তনহাড়ের উপর রেখে, <strong>২-২.৫ ইঞ্চি (৫-৬ সেমি)</strong> গভীর চাপ দিন</li>
      <li><strong>শিশু (Children, ১-১২ বছর):</strong> শুধু <strong>এক হাত</strong> দিয়ে, <strong>১-১.৫ ইঞ্চি</strong> গভীর চাপ দিন</li>
      <li><strong>নবজাতক/অতি শিশু (Infant, ০-১ বছর):</strong> <strong>দুই আঙুল</strong> (বা দুই বুড়ো আঙুল দিয়ে বুক ঘিরে ধরার কৌশল — নিচে নরম কাপড় দিয়ে শক্ত স্থানের উপর) দিয়ে, স্তনের মাঝামাঝি জায়গায় <strong>০.৫-১ ইঞ্চি</strong> গভীর হালকা চাপ দিন</li>
    </ul>
  </div>

  <div class="trainer-note">
    <p><strong>ব্যতিক্রম — পানিতে ডোবা (Drowning):</strong> পানিতে ডুবে যাওয়া আক্রান্ত অজ্ঞান ও শ্বাসহীন হলে সরাসরি কম্প্রেশনে না গিয়ে প্রথমে <strong>৫টি জীবনরক্ষাকারী রেসকিউ ব্রিদ (ফু)</strong> দিন, তারপর স্বাভাবিক ৩০ কম্প্রেশন + ২ ব্রিদ চক্রে ফিরে যান।</p>
  </div>

  <div class="example-card">
    <span class="ex-label">বাস্তব উদাহরণ</span>
    থানার ডিউটিরুমে একজন সহকর্মী হঠাৎ পড়ে গিয়ে সাড়া দিচ্ছেন না, শ্বাস স্বাভাবিক মনে হচ্ছে না। সাথে সাথে ৯৯৯-এ কল করে সমতল মেঝেতে শুইয়ে বুক কম্প্রেশন শুরু করুন — দেরি না করে।
  </div>

  <div class="trainer-note">
    <p><strong>কীভাবে শেখাবেন:</strong> CPR সেশনের সবচেয়ে গুরুত্বপূর্ণ অংশ হলো ম্যানিকিনে হাতেকলমে অনুশীলন, কারণ হাতের অবস্থান ও গতি ভুল হলে কার্যকারিতা থাকে না।</p>
    <ul>
      <li>প্রতিটি প্রশিক্ষণার্থীকে কমপক্ষে ২ মিনিট একটানা কম্প্রেশন অনুশীলন করান — ক্লান্তি বোঝানোর জন্য</li>
      <li>একটি জোরালো তালের গান বাজিয়ে সঠিক গতি অনুভব করান</li>
      <li>জোড়ায় ভাগ করে একজন গণনা করুক, অন্যজন কম্প্রেশন দিক — এরপর পালাবদল</li>
    </ul>
  </div>

  <div class="mnemonic"><span class="m-icon">🧠</span> মনে রাখুন: <b>৩০:২ অনুপাত</b>, গভীরতা ৫-৬ সেমি, গতি ১০০-১২০/মিনিট — "Stayin' Alive" গানের তালে চাপুন</div>
  `

{
  id:"aid-6", part:"aid", day:"Day 2 · Session 6", num:6,
  title:"ক্ষত ও ক্ষত ড্রেসিং",
  subtitle:"বিভিন্ন ধরনের ক্ষত পরিষ্কার ও ব্যান্ডেজ করার পদ্ধতি",
  html:`
  <div class="section-block">
    <h3><span class="dot"></span>ক্ষতের প্রকারভেদ</h3>
    <ul>
      <li><strong>ছেদ ক্ষত (Cut/Incision):</strong> ধারালো বস্তুর দ্বারা সোজা কাটা</li>
      <li><strong>ঘর্ষণ ক্ষত (Abrasion):</strong> ত্বকের উপরিভাগ ছিলে যাওয়া</li>
      <li><strong>ছিদ্র ক্ষত (Puncture):</strong> সুচালো বস্তু দিয়ে গভীর ছিদ্র</li>
      <li><strong>ছেঁড়া ক্ষত (Laceration):</strong> অনিয়মিত কিনারাযুক্ত ছেঁড়া ক্ষত</li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>ধাপে ধাপে ড্রেসিং পদ্ধতি</h3>
    <ol>
      <li>হাত ধুয়ে/গ্লাভস পরে শুরু করুন</li>
      <li>রক্তক্ষরণ থাকলে আগে সরাসরি চাপ দিয়ে নিয়ন্ত্রণ করুন</li>
      <li>পরিষ্কার পানি দিয়ে ক্ষতস্থান ধুয়ে ময়লা/জীবাণু দূর করুন — কেন্দ্র থেকে বাইরের দিকে মুছুন</li>
      <li>জীবাণুমুক্ত গজ দিয়ে ক্ষতটি ঢেকে দিন</li>
      <li>ব্যান্ডেজ দিয়ে সঠিক টানে বাঁধুন — খুব শক্ত নয় (রক্ত চলাচল বাধাগ্রস্ত হয় না তেমন), খুব ঢিলাও নয়</li>
      <li>বাঁধার পর আঙুলের রং/তাপমাত্রা দেখে রক্ত চলাচল পরীক্ষা করুন</li>

  html:`

    <ul>

      <li><strong>স্ট্রেইন:</strong> মাংসপেশি বা টেন্ডন টান খাওয়া</li>

  </div>

  <div class="section-block">
    <h3><span class="dot"></span>লক্ষণ</h3>
    <ul>
      <li>তীব্র ব্যথা, ফোলা, বিকৃত আকৃতি</li>
      <li>নড়াচড়ায় অক্ষমতা, নড়াচড়ায় শব্দ (ক্র্যাক)</li>
      <li>যৌগিক ফ্র্যাকচারে হাড় দৃশ্যমান হতে পারে</li>
    </ul>
  </div>

  <div class="section-block">
    <h3><span class="dot"></span>ধাপে ধাপে করণীয় (RICE + Splinting)</h3>
    <ol>
      <li>আক্রান্ত অংশ নড়াচড়া বন্ধ রাখুন — যতটুকু পাওয়া গেছে সেই অবস্থাতেই স্থির রাখুন</li>
      <li><strong>স্প্লিন্ট</strong> (শক্ত বোর্ড/কাঠ/মোটা কাগজ) দিয়ে আক্রান্ত অংশের উপর-নিচের জয়েন্ট সহ অচল করুন</li>

/* ================= APP LOGIC ================= */
const STORAGE_KEY = "toptraining_progress_v1";
function getProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function setProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}

let currentId = null;

function buildNav(){
  const container = document.getElementById("navContainer");
  container.innerHTML = "";
  const progress = getProgress();

  const partInfo = topics.filter(t=>t.part==="info");
  const partA = topics.filter(t=>t.part==="aid");
  const partB = topics.filter(t=>t.part==="tot");

  const labelI = document.createElement("div");
  labelI.className = "nav-part-label";
  labelI.textContent = "ICRC পরিচিতি";
  container.appendChild(labelI);
  partInfo.forEach(t => container.appendChild(navItem(t, progress)));

  const labelA = document.createElement("div");
  labelA.className = "nav-part-label";
  labelA.textContent = "Part 1 · ফার্স্ট এইড (Day 1–3)";
  container.appendChild(labelA);
  partA.forEach(t => container.appendChild(navItem(t, progress)));

  const labelB = document.createElement("div");
  labelB.className = "nav-part-label";
  labelB.textContent = "Part 2 · ট্রেনিং মেথডোলজি (Day 4–5)";
  container.appendChild(labelB);
  partB.forEach(t => container.appendChild(navItem(t, progress)));
}

function navItem(t, progress){
  const el = document.createElement("div");
  el.className = "nav-item" + (t.id===currentId ? " active" : "");
  el.dataset.id = t.id;
  el.innerHTML = `<span class="tag">${t.num}</span><span>${t.title}</span><span class="learned-dot ${progress[t.id]?'on':''}"></span>`;
  el.addEventListener("click", ()=>{ showTopic(t.id); closeSidebarMobile(); });
  return el;
}

function updateProgressBar(){
  const progress = getProgress();
  const trackable = topics.filter(t=>!t.id.endsWith("-overview") && t.id!=="icrc-info");
  const total = trackable.length;
  const done = trackable.filter(t=>progress[t.id]).length;
  document.getElementById("progressText").textContent = `${done} / ${total}`;
  document.getElementById("progressFill").style.width = (total? (done/total*100):0) + "%";
}

function renderHome(){
  currentId = null;
  const main = document.getElementById("mainContent");
  main.innerHTML = `
    <div class="home-hero">
      <h1>৫ দিনের প্রশিক্ষণ সহায়িকা</h1>
      <p>Day 1–3-এর ফার্স্ট এইড টপিকগুলো বিস্তারিতভাবে শিখুন, উদাহরণসহ বুঝুন, এবং Day 4–5-এ শেখা ট্রেনিং মেথডোলজি প্রয়োগ করে নিজে দক্ষ প্রশিক্ষক হয়ে উঠুন। বাম পাশের তালিকা থেকে যেকোনো টপিকে ক্লিক করুন।</p>
    </div>
    <div class="example-card" id="goInfo" style="cursor:pointer;">
      <span class="ex-label">ICRC পরিচিতি</span>
      বাংলাদেশে ICRC-এর ২০২৫ সালের কার্যক্রম ও এই প্রশিক্ষণের প্রেক্ষাপট জানতে ক্লিক করুন।
    </div>
    <div class="home-cards">
      <div class="home-card aid" id="goAid">
        <div class="hc-badge">PART 1 · FIRST AID</div>
        <h3>১২টি ফার্স্ট এইড টপিক</h3>
        <p>Choking থেকে শুরু করে CPR, শক, রক্তক্ষরণ, পোড়া, ফ্র্যাকচার, বিষক্রিয়া, কামড় ও পরিবহন — প্রতিটির বিস্তারিত করণীয়/বর্জনীয়, উদাহরণ ও শেখানোর টিপস।</p>
      </div>
      <div class="home-card tot" id="goTot">
        <div class="hc-badge">PART 2 · TRAINING METHODOLOGY</div>
        <h3>ট্রেনিং অব ট্রেইনার্স</h3>
        <p>ট্রেনিং সাইকেল, ফোর স্টেপ মেথড, ট্রেনিং পদ্ধতি ও উপকরণ, অঙ্গভঙ্গি-ভঙ্গিমা, মনিটরিং-মূল্যায়ন ও ফাইনাল প্রেজেন্টেশন প্রস্তুতি।</p>
      </div>
    </div>
  `;
  document.getElementById("goAid").addEventListener("click", ()=>showTopic("aid-overview"));
  document.getElementById("goTot").addEventListener("click", ()=>showTopic("tot-overview"));
  document.getElementById("goInfo").addEventListener("click", ()=>showTopic("icrc-info"));
  buildNav();
}

function showTopic(id){
  const t = topics.find(x=>x.id===id);
  if(!t) return;
  currentId = id;
  const idx = topics.indexOf(t);
  const prev = topics[idx-1];
  const next = topics[idx+1];
  const progress = getProgress();
  const isLearned = !!progress[id];

  const main = document.getElementById("mainContent");
  main.innerHTML = `
    <div class="topic-header">
      <div class="topic-eyebrow">
        <span class="badge ${t.part}">${t.part==='aid' ? 'FIRST AID' : t.part==='tot' ? 'TRAINING METHOD' : 'ICRC INFO'}</span>
        <span class="day-chip">${t.day}</span>
      </div>
      <h2>${t.title}</h2>
      <p class="subtitle">${t.subtitle}</p>
      <button class="mark-learned ${isLearned?'on':''}" id="learnBtn">${isLearned ? '✓ শেখা হয়েছে' : 'শেখা হয়েছে চিহ্নিত করুন'}</button>
    </div>
    <div class="topic-body">${t.html}</div>
    <div class="footer-nav">
      <button id="prevBtn" ${!prev?'disabled':''}>
        <span class="lbl">← আগের টপিক</span>
        <span>${prev ? prev.title : ''}</span>
      </button>
      <button class="next" id="nextBtn" ${!next?'disabled':''}>
        <span class="lbl">পরের টপিক →</span>
        <span>${next ? next.title : ''}</span>
      </button>
    </div>
  `;

  document.getElementById("learnBtn").addEventListener("click", ()=>{
    const p = getProgress();
    p[id] = !p[id];
    setProgress(p);
    showTopic(id);
    updateProgressBar();
  });
  if(prev) document.getElementById("prevBtn").addEventListener("click", ()=>showTopic(prev.id));
  if(next) document.getElementById("nextBtn").addEventListener("click", ()=>showTopic(next.id));

  buildNav();
  window.scrollTo({top:0, behavior:"instant"});
  document.querySelector(".main").scrollTo({top:0, behavior:"instant"});
}

/* Search */
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
searchInput.addEventListener("input", ()=>{
  const q = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML = "";
  if(!q){ return; }
  const hits = topics.filter(t =>
    t.title.toLowerCase().includes(q) ||
    t.subtitle.toLowerCase().includes(q) ||
    t.html.toLowerCase().includes(q)
  ).slice(0,8);
  hits.forEach(t=>{
    const div = document.createElement("div");
    div.className = "search-hit";
    div.innerHTML = `<b>${t.part==='aid'?'FA':'ToT'}</b> · ${t.title}`;
    div.addEventListener("click", ()=>{
      showTopic(t.id);
      searchInput.value = "";
      searchResults.innerHTML = "";
      closeSidebarMobile();
    });
    searchResults.appendChild(div);
  });
});

/* Mobile sidebar */
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
document.getElementById("menuBtn").addEventListener("click", ()=>{
  sidebar.classList.add("open");
  overlay.classList.add("show");
});
overlay.addEventListener("click", closeSidebarMobile);
function closeSidebarMobile(){
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

/* Init */
updateProgressBar();
renderHome();
</script>
</body>
